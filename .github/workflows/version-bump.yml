name: Version Bump

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize]

concurrency:
  group: version-bump-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version-bump:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install prothon dependencies
        run: |
          pip install .

      - name: Apply version bump
        run: |
          git fetch origin master
          MERGE_BASE=$(git merge-base HEAD origin/master)
          prothon ci bump --before-sha "$MERGE_BASE" --no-tag

      - name: Commit and push version bump
        run: |
          NEW_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml
          git add src/

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push
