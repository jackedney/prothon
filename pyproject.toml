[project]
name = "prothon"
version = "0.1.0"
description = "Python project generator with docs-first AI workflow"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.15",
    "jinja2>=3.1",
    "tomli-w>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "poethepoet>=0.32",
    "ruff>=0.15",
    "ty>=0.0.1a",
    "bandit[toml]>=1.9",
    "vulture>=2.14",
    "complexipy>=5.1",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prothon"]

[tool.hatch.build.targets.wheel.force-include]
"template" = "prothon/template"

[project.scripts]
prothon = "prothon.cli:app"

[tool.poe.tasks]
sync = { shell = "uv sync && pre-commit install" }
lint = "ruff check src/ tests/"
format = "ruff format --check src/ tests/"
typecheck = "ty check"
test = "pytest tests/"
security = "bandit -c pyproject.toml -r src/"
deadcode = "vulture src/ --min-confidence=61"
complexity = "complexipy src/ --max-complexity-allowed 20"
check = ["lint", "format", "typecheck", "test", "security", "deadcode", "complexity"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603", "B607", "B701"]
