[project]
name = "prothon"
version = "3.1.0"
description = "Python project generator with docs-first AI workflow"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.15",
    "jinja2>=3.1",
    "tomlkit>=0.13,<1.0",
    "copier>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "poethepoet>=0.32",
    "ruff>=0.15",
    "ty>=0.0.1a",
    "bandit[toml]>=1.9",
    "vulture>=2.14",
    "complexipy>=5.1",
    "pre-commit>=4.0",
    "hypothesis>=6.0",
    "mutmut>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prothon"]

[tool.hatch.build.targets.wheel.force-include]
"template" = "prothon/template"

[project.scripts]
prothon = "prothon.cli:app"

[tool.poe.tasks]
sync = { shell = "uv sync && pre-commit install" }
lint = "ruff check src/ tests/"
format = "ruff format --check src/ tests/"
typecheck = "ty check src/ tests/"
test = "pytest tests/"
test-mut = { cmd = "mutmut run", help = "Run mutation testing" }
security = "bandit -c pyproject.toml -r src/"
deadcode = "vulture src/"
complexity = "complexipy src/ --max-complexity-allowed 20"
check = ["lint", "format", "typecheck", "test", "security", "deadcode", "complexity"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.mutmut]
paths_to_mutate = ["src/prothon/"]
tests_dir = ["tests/"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603", "B607", "B701"]

[tool.prothon.ci]
auto_version = true
