[project]
name = "prothon"
version = "0.1.0"
description = "Python project generator with docs-first AI workflow"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.15",
    "jinja2>=3.1",
    "tomli-w>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prothon"]

[tool.hatch.build.targets.wheel.force-include]
"template" = "prothon/template"

[project.scripts]
prothon = "prothon.cli:app"
